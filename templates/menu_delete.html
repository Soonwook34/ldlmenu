{% extends "base.html" %}
{% block title %}메뉴 삭제{% endblock %}
{% block content %}
<div class="row my-3 align-items-center">
    <div class="col"><a class="btn btn-primary" href="/">돌아가기</a></div>
    <div class="col"><p class="m-0">삭제할 메뉴를 선택해 주세요.</p></div>
    <div class="col"><button class="btn btn-danger" id="delete-btn">삭제하기</button></div>
</div>
{% set selected = [] %}
{% include "_menu_grid.html" %}
{% endblock %}
{% block script %}
<script>
    onClick("delete-btn", async () => {
        const ids = checkedIds();
        if (ids.length === 0) return alert("삭제할 메뉴를 한 개 이상 선택해 주세요.");
        if (!confirm(`${ids.length}개 메뉴를 삭제할까요?\n해당 메뉴에 들어간 표만 빠지고, 나머지 투표는 유지됩니다.`)) return;
        await api("/api/menus/delete", { ids });
        location.reload();
    });
</script>
{% endblock %}
