{% extends "base.html" %}
{% block title %}사용자 삭제{% endblock %}
{% block content %}
<div class="row my-3 align-items-center">
    <div class="col"><a class="btn btn-primary" href="/">돌아가기</a></div>
    <div class="col"><p class="m-0">삭제할 사용자를 선택해 주세요.</p></div>
    <div class="col"><button class="btn btn-danger" id="delete-btn">삭제하기</button></div>
</div>
{% set selectable = true %}
{% include "_user_grid.html" %}
{% endblock %}
{% block script %}
<script>
    onClick("delete-btn", async () => {
        const ids = checkedIds();
        if (ids.length === 0) return alert("삭제할 사용자를 한 명 이상 선택해 주세요.");
        if (!confirm(`${ids.length}명을 삭제할까요?`)) return;
        await api("/api/users/delete", { ids });
        location.reload();
    });
</script>
{% endblock %}
