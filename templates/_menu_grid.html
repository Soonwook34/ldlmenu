<div class="container">
    {% for category in categories %}
    <div class="row category my-2 justify-content-center align-items-center">
        <p class="fw-semibold fs-3 my-2 category">{{category.name}}</p>
        <div class="row row-cols-3 px-0">
            {% for food in category.menus %}
            <div class="col form-check my-1 px-1">
                <input type="checkbox" class="btn-check" id="m{{food.id}}" data-id="{{food.id}}" autocomplete="off" {% if food.id in selected %}checked{% endif %}>
                <label class="btn btn-outline-dark d-block px-0 text-truncate" for="m{{food.id}}">{{food.name}}</label>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
