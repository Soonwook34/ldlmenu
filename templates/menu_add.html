{% extends "base.html" %}
{% block title %}메뉴 추가{% endblock %}
{% block content %}
<div class="row my-3 align-items-center">
    <div class="col"><a class="btn btn-primary" href="/">돌아가기</a></div>
    <div class="col"><p class="m-0">추가할 메뉴를 입력해 주세요.</p></div>
    <div class="col"><button class="btn btn-danger" id="add-btn">추가하기</button></div>
</div>
<div class="row mb-3">
    <div class="col-1"></div>
    <div class="col">
        <label for="category" class="fw-bold fs-5">카테고리</label>
        <select class="form-select text-center" id="category">
            {% for category in categories %}<option value="{{category.id}}">{{category.name}}</option>{% endfor %}
        </select>
    </div>
    <div class="col">
        <label for="menu" class="fw-bold fs-5">메뉴</label>
        <input type="text" class="form-control text-center" id="menu" placeholder="메뉴" maxlength="20">
    </div>
    <div class="col-1"></div>
</div>
{% set selected = [] %}
{% include "_menu_grid.html" %}
{% endblock %}
{% block script %}
<script>
    onClick("add-btn", async () => {
        const category = document.getElementById("category");
        const menu = document.getElementById("menu").value.trim();
        if (!menu) return alert("메뉴 이름을 입력해 주세요.");
        if (!confirm(`${category.options[category.selectedIndex].text}에 '${menu}'을/를 추가할까요?`)) return;
        await api("/api/menus", { category_id: Number(category.value), name: menu });
        location.reload();
    });
</script>
{% endblock %}
