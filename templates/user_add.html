{% extends "base.html" %}
{% block title %}사용자 추가{% endblock %}
{% block content %}
<div class="row my-3 align-items-center">
    <div class="col"><a class="btn btn-primary" href="/">돌아가기</a></div>
    <div class="col"><p class="m-0">추가할 이름을 입력해 주세요.</p></div>
    <div class="col"><button class="btn btn-danger" id="add-btn">추가하기</button></div>
</div>
<div class="row mb-3 justify-content-center">
    <div class="col-6">
        <input type="text" class="form-control text-center" id="name" placeholder="이름" maxlength="20" aria-label="이름">
    </div>
</div>
{% set selectable = false %}
{% include "_user_grid.html" %}
{% endblock %}
{% block script %}
<script>
    onClick("add-btn", async () => {
        const name = document.getElementById("name").value.trim();
        if (!name) return alert("이름을 입력해 주세요.");
        if (!confirm(`사용자 '${name}'을/를 추가할까요?`)) return;
        await api("/api/users", { name });
        location.reload();
    });
</script>
{% endblock %}
