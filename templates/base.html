<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Pacifico&display=swap" rel="stylesheet">
    <link href="/static/src/main.css" rel="stylesheet">
    <title>[SKKU-LDL] {% block title %}메뉴 투표판{% endblock %}</title>
</head>
<body>
    <main class="container-xl shadow-lg rounded text-center">
        <div class="row mt-3 align-items-center">
            <p class="my-3 fs-3 fw-bold title">LearnData Lab MENU</p>
        </div>
        {% block content %}{% endblock %}
        <div class="row align-items-center pb-2">
            <div class="col"></div>
            <div class="col">
                <p class="m-0">{{script}} <a class="link-success link-underline-opacity-0 link-underline-opacity-75-hover" href="{{github}}" target="_blank">깃헙</a></p>
            </div>
            <div class="col">{% block footer_right %}{% endblock %}</div>
        </div>
    </main>
    <script src="/static/src/api.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
