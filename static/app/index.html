<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="SKKU LearnData Lab 점심·저녁 메뉴 투표" />
    <title>LDL 메뉴 투표</title>
    <!-- 홈 화면에 추가(웹앱) -->
    <link rel="manifest" href="/static/app/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/app/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/app/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LDL 메뉴" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 글꼴: Jua(배민 주아체) 하나로 통일. 한글은 Google Fonts가 필요한 글자 묶음만 내려받는다 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <script>
      // 첫 페인트 전에 테마를 적용해 깜빡임을 막는다
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
          document.documentElement.dataset.accent = localStorage.getItem("accent") || "green";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", d ? "#09090b" : "#fafafa");
        } catch (e) {}
      })();
    </script>
    <!--app-state-->
    <script type="module" crossorigin src="/static/app/assets/index-DAsuotEq.js"></script>
    <link rel="stylesheet" crossorigin href="/static/app/assets/index-Bpwz_ZoX.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
